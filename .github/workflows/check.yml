name: Source checks

# Fast CI is the default. An explicit workflow_dispatch checkbox is required
# before a full regression or the historical browser fixture campaign can run.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tests/project-scenarios/**'
      - 'tests/*-scenario.test.mjs'
      - 'tests/*-variant.test.mjs'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run the complete pnpm test suite (explicit opt-in)'
        type: boolean
        required: false
        default: false
      browser_acceptance:
        description: 'Run historical Mood-to-Music browser acceptance (explicit opt-in)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
      - name: Typecheck
        run: pnpm run typecheck
      - name: Directly affected tests (all PR states and main)
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/ci-focused-tests.mjs
      - name: Build (review-ready, main and manual runs)
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm run build
      - name: Full regression (explicit manual request only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression == true
        run: pnpm test
      - name: Historical fixture revision tests and Vite build (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_acceptance == true
        run: |
          if [ -f examples/mood-to-music/tests/revisions.test.mjs ]; then
            node --test examples/mood-to-music/tests/revisions.test.mjs
            pnpm exec vite build --config examples/mood-to-music/vite.config.mjs
          fi
      - name: Install Chromium (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_acceptance == true
        run: |
          if [ -f examples/mood-to-music/tests/browser.test.mjs ]; then
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Historical fixture browser acceptance (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_acceptance == true
        run: |
          if [ -f examples/mood-to-music/tests/browser.test.mjs ]; then
            node --test examples/mood-to-music/tests/browser.test.mjs
          fi
