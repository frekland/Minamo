name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: node --test examples/mood-to-music/tests/revisions.test.mjs
      - run: pnpm exec vite build --config examples/mood-to-music/vite.config.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test examples/mood-to-music/tests/browser.test.mjs
